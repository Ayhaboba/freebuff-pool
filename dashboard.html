<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freebuff pool</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f12;
        --panel: #15181e;
        --panel-2: #1b1f27;
        --line: #262d3a;
        --text: #e7ebf3;
        --dim: #8d97a8;
        --accent: #7ee3a1;
        --warn: #f3c969;
        --bad: #f07c7c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        padding: 28px 32px 60px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
      .sub { color: var(--dim); font-size: 12px; margin-bottom: 22px; }
      .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: stretch; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        min-width: 260px;
        flex: 1 1 300px;
        max-width: 460px;
        position: relative;
      }
      .card.active { border-color: #3f7a55; box-shadow: inset 0 0 0 1px #2c5b3f; }
      .card.dead { opacity: 0.62; }
      .name { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; }
      .badge {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
        padding: 2px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
      }
      .badge.on { color: var(--accent); border-color: #2c5b3f; }
      .badge.cool { color: var(--warn); border-color: #5c4a22; }
      .badge.dead { color: var(--bad); border-color: #5c2b2b; }
      .mail { color: var(--dim); font-size: 12px; margin: 2px 0 10px; word-break: break-all; }
      .meters { display: grid; gap: 6px; margin-bottom: 10px; }
      .meter { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 12px; }
      .bar { height: 4px; background: #232936; border-radius: 3px; overflow: hidden; margin-top: 3px; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .bar.low > i { background: var(--warn); }
      .bar.none > i { background: var(--bad); }
      .meta { color: var(--dim); font-size: 11px; margin: 6px 0 10px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
        border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
      }
      button:hover { border-color: #3a4456; }
      button.primary { border-color: #2c5b3f; color: var(--accent); }
      button.danger { color: var(--bad); }
      button:disabled { opacity: 0.45; cursor: default; }
      .toolbar { display: flex; gap: 10px; align-items: center; margin: 0 0 18px; }
      .toolbar .spacer { flex: 1; }
      #events {
        margin-top: 26px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; padding: 12px 14px; max-height: 260px; overflow: auto;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
        white-space: pre-wrap;
      }
      #msg { color: var(--warn); font-size: 12px; min-height: 16px; }
      a { color: #8fb8ff; }
    </style>
  </head>
  <body>
    <h1>Freebuff account pool</h1>
    <div class="sub" id="sub">loading…</div>
    <div class="toolbar">
      <button class="primary" id="add">+ Add account</button>
      <button id="refresh">Refresh</button>
      <span class="spacer"></span>
      <span id="msg"></span>
    </div>
    <div class="row" id="cards"></div>
    <div id="events"></div>

    <script>
      const token = new URLSearchParams(location.search).get("token") || "";
      const $ = (id) => document.getElementById(id);
      const api = (path) =>
        fetch(path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token), {
          headers: { "x-pool-token": token },
        }).then(async (r) => {
          const body = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(body.error || r.statusText);
          return body;
        });

      const fmtLeft = (ms) => {
        if (ms == null) return "permanent";
        if (ms <= 0) return "ready";
        const m = Math.ceil(ms / 60000);
        if (m < 60) return m + "m";
        const h = Math.floor(m / 60), r = m % 60;
        return r ? h + "h " + r + "m" : h + "h";
      };
      const ago = (t) => {
        if (!t) return "never used";
        const s = Math.max(0, (Date.now() - t) / 1000);
        if (s < 90) return "used " + Math.round(s) + "s ago";
        if (s < 5400) return "used " + Math.round(s / 60) + "m ago";
        return "used " + Math.round(s / 3600) + "h ago";
      };

      function meters(quota, model) {
        if (!quota) return '<div class="meta">no quota data yet</div>';
        const rows = [];
        if (quota.freebucks) {
          const bal = quota.freebucks.balance;
          rows.push(
            `<div class="meter"><span>freebucks balance</span><span>${bal == null ? "?" : bal.toFixed(2)}</span></div>`,
          );
        }
        const limits = quota.rateLimits || {};
        for (const [name, q] of Object.entries(limits).slice(0, 3)) {
          const remaining = q.remaining == null ? null : q.remaining;
          const limit = q.limit == null ? null : q.limit;
          const pct = remaining != null && limit ? Math.round((remaining / limit) * 100) : null;
          const shown = remaining == null ? (limit == null ? "?" : `cap ${limit}`) : `${remaining}${limit == null ? "" : " / " + limit}`;
          rows.push(
            `<div><div class="meter"><span>${name}</span><span>${shown}</span></div>${
              pct == null
                ? ""
                : `<div class="bar ${pct === 0 ? "none" : pct < 25 ? "low" : ""}"><i style="width:${pct}%"></i></div>`
            }</div>`,
          );
        }
        rows.push(
          `<div class="meta">tier ${quota.accessTier ?? "?"}${quota.subscription ? " · " + quota.subscription : ""}${
            quota.freebucks?.dailyResetAt ? " · daily reset " + new Date(quota.freebucks.dailyResetAt).toLocaleString() : ""
          }</div>`,
        );
        return rows.join("");
      }

      function card(a) {
        const badges = [
          a.active ? '<span class="badge on">active</span>' : "",
          a.cooldown && !a.cooldown.terminal ? `<span class="badge cool">cooling ${fmtLeft(a.cooldown.remainingMs)}</span>` : "",
          a.cooldown?.terminal ? '<span class="badge dead">parked</span>' : "",
        ].join("");
        return `<div class="card ${a.active ? "active" : ""} ${a.cooldown?.terminal ? "dead" : ""}">
          <div class="name">${escapeHtml(a.label)} ${badges}</div>
          <div class="mail">${escapeHtml(a.email || a.id)}</div>
          <div class="meters">${meters(a.quota)}</div>
          <div class="meta">${ago(a.lastUsedAt)} · switches ${a.switches}${
            a.cooldown?.status ? " · last stop: " + escapeHtml(a.cooldown.status) : ""
          }</div>
          <div class="meta">egress ${escapeHtml(a.identity?.proxy || "direct")}${
            a.identity?.timezone ? " · tz " + escapeHtml(a.identity.timezone) : ""
          }${a.identity?.installId ? " · device " + escapeHtml(a.identity.installId.slice(0, 8)) : ""}</div>
          <div class="actions">
            <button class="primary" data-switch="${a.id}" ${a.active || a.cooldown?.terminal ? "disabled" : ""}>Switch</button>
            <button data-clear="${a.id}" ${a.cooldown ? "" : "disabled"}>Clear cooldown</button>
            <button data-label="${a.id}">Rename</button>
            <button class="danger" data-remove="${a.id}" ${a.active || a.cooldown?.terminal ? "disabled" : ""}>Remove</button>
          </div>
        </div>`;
      }

      function escapeHtml(v) {
        return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      let state = null;
      async function refresh() {
        try {
          state = await api("/api/status");
          $("sub").textContent = `pid ${state.pid} · ${state.accounts.length} account(s) · ${state.statePath}`;
          $("cards").innerHTML = state.accounts.map(card).join("") || '<div class="sub">no accounts yet — add one</div>';
          $("events").textContent = (state.events || []).map((e) => e.at.slice(11, 19) + "  " + e.line).join("\n") || "no events";
        } catch (error) {
          $("sub").textContent = "control plane unreachable: " + error.message;
        }
      }

      async function act(path) {
        $("msg").textContent = "";
        try {
          await api(path);
        } catch (error) {
          $("msg").textContent = error.message;
        }
        await refresh();
      }

      $("add").onclick = async () => {
        $("msg").textContent = "starting sign-in…";
        try {
          const started = await api("/api/add");
          window.open(started.url, "_blank", "noopener");
          $("msg").textContent = "sign in in the new tab; the account is added automatically";
        } catch (error) {
          $("msg").textContent = error.message;
        }
      };
      $("refresh").onclick = refresh;
      document.addEventListener("click", async (event) => {
        const t = event.target;
        if (!(t instanceof HTMLElement) || !t.dataset) return;
        if (t.dataset.switch) await act("/api/switch?id=" + encodeURIComponent(t.dataset.switch));
        if (t.dataset.clear) await act("/api/clear?id=" + encodeURIComponent(t.dataset.clear));
        if (t.dataset.remove) await act("/api/remove?id=" + encodeURIComponent(t.dataset.remove));
        if (t.dataset.label) {
          const next = prompt("New label for this account:");
          if (next) await act("/api/label?id=" + encodeURIComponent(t.dataset.label) + "&label=" + encodeURIComponent(next));
        }
      });
      refresh();
      setInterval(refresh, 4000);
    </script>
  </body>
</html>
